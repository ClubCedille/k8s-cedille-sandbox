gateway: {enabled: false}
agentBackend: {enabled: false}
agentRuntime: {enabled: false}
unstructured: {enabled: false}
# Enterprise plugin manager (the rest of the enterprise components are off in helm/values.yaml)
plugin_manager: {enabled: false}
persistence:
  type: local
  local:
    persistentVolumeClaim:
      existingClaim: dify-backend-pvc
externalDatabase:
  enabled: true
  engine: postgres
  host: cnpg-rw
  port: 5432
  user: dify
  password: "#REPLACE_ME#"
  dialectOptions:
    postgres:
      sslMode: disable
externalRedis:
  enabled: false
redis:
  enabled: true
  architecture: standalone
  # Password from Vault (prod/vault.yaml); the subchart then creates no Secret
  auth:
    existingSecret: dify-vault-redis
    existingSecretPasswordKey: REDIS_PASSWORD
  master:
    persistence:
      storageClass: cephfs
      size: 2Gi
vectorDB:
  useExternal: true
  externalType: pgvector
  externalPgvector:
    host: cnpg-rw
    port: 5432
    user: dify
    password: "#REPLACE_ME#"
    database: dify
