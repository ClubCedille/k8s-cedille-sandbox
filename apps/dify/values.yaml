# Overrides for the community Dify chart (https://github.com/BorisPolonsky/dify-helm).
# Anything not set here uses the chart's defaults:
#   helm show values dify --repo https://borispolonsky.github.io/dify-helm --version 0.38.0
#
# Secrets never live here: the chart's generated Secrets only hold placeholder
# defaults, and every real credential is injected with `extraEnv` from the
# Secrets that Vault Secrets Operator creates (see vault.yaml). `extraEnv` wins
# over the chart's Secret because `env` takes precedence over `envFrom`.

global:
  consoleApiDomain: dify.sandbox.cedille.club
  consoleWebDomain: dify.sandbox.cedille.club
  serviceApiDomain: dify.sandbox.cedille.club
  appApiDomain: dify.sandbox.cedille.club
  appWebDomain: dify.sandbox.cedille.club
  filesDomain: dify.sandbox.cedille.club
  triggerDomain: dify.sandbox.cedille.club

# Applied to every Dify Deployment. Checks skipped on purpose:
# - pod-networkpolicy: no NetworkPolicies in this cluster yet (same as apps/httpbin)
# - container-security-context-readonlyrootfilesystem: the images write to their filesystem
# - container-security-context-user-group-id: the images are built for UID 1001 and
#   sandbox needs root for chroot
# - container-image-pull-policy: the worker's `check-api` init container has no
#   pullPolicy setting (every main container sets Always below)
annotations: &kubeScoreIgnore
  kube-score/ignore: >-
    pod-networkpolicy,
    container-security-context-readonlyrootfilesystem,
    container-security-context-user-group-id,
    container-image-pull-policy

image:
  api: {pullPolicy: Always}
  web: {pullPolicy: Always}
  sandbox: {pullPolicy: Always}
  pluginDaemon: {pullPolicy: Always}

api:
  # TCP liveness vs the chart's HTTP readiness, so the probes differ
  customLivenessProbe:
    tcpSocket: {port: api}
    initialDelaySeconds: 30
    periodSeconds: 30
  resources:
    requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
    limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
  # Shared with worker and beat. $(VAR) only expands variables defined
  # earlier in the list, so REDIS_PASSWORD comes before CELERY_BROKER_URL.
  extraEnv: &apiEnv
    - name: CHECK_UPDATE_URL
      value: ""
    - name: SECRET_KEY
      valueFrom: {secretKeyRef: {name: dify-app, key: SECRET_KEY}}
    - name: DB_PASSWORD
      valueFrom: {secretKeyRef: {name: dify-secret, key: password}}
    - name: PGVECTOR_PASSWORD
      valueFrom: {secretKeyRef: {name: dify-secret, key: password}}
    - name: REDIS_PASSWORD
      valueFrom: {secretKeyRef: {name: dify-redis, key: REDIS_PASSWORD}}
    - name: CELERY_BROKER_URL
      value: redis://:$(REDIS_PASSWORD)@dify-redis-master:6379/1
    - name: CODE_EXECUTION_API_KEY
      valueFrom: {secretKeyRef: {name: dify-app, key: SANDBOX_API_KEY}}
    - name: PLUGIN_DAEMON_KEY
      valueFrom: {secretKeyRef: {name: dify-app, key: PLUGIN_DAEMON_KEY}}
    - name: INNER_API_KEY_FOR_PLUGIN
      valueFrom: {secretKeyRef: {name: dify-app, key: PLUGIN_INNER_API_KEY}}
    - name: SMTP_USERNAME
      valueFrom: {secretKeyRef: {name: dify-smtp, key: SMTP_USERNAME}}
    - name: SMTP_PASSWORD
      valueFrom: {secretKeyRef: {name: dify-smtp, key: SMTP_PASSWORD}}
  mail:
    type: smtp
    defaultSender: "Dify <no-reply@cedille.club>"
    smtp:
      server: smtp.example.com  # TODO: set the real SMTP host
      port: 465
      tls:
        enabled: true
  persistence:
    persistentVolumeClaim:
      storageClass: cephfs

worker:
  resources:
    requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
    limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
  extraEnv: *apiEnv

beat:
  resources:
    requests: {cpu: 50m, memory: 256Mi, ephemeral-storage: 512Mi}
    limits: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
  containerSecurityContext:
    enabled: true
    runAsUser: 1001
    allowPrivilegeEscalation: false
  extraEnv: *apiEnv

web:
  # TCP liveness vs the chart's HTTP readiness, so the probes differ
  customLivenessProbe:
    tcpSocket: {port: web}
    initialDelaySeconds: 30
    periodSeconds: 30
  resources:
    requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi}
    limits: {cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi}
  containerSecurityContext:
    allowPrivilegeEscalation: false

sandbox:
  # TCP liveness vs the chart's HTTP readiness, so the probes differ
  customLivenessProbe:
    tcpSocket: {port: sandbox}
    initialDelaySeconds: 30
    periodSeconds: 30
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 512Mi}
    limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 1Gi}
  containerSecurityContext:
    allowPrivilegeEscalation: false
  extraEnv:
    - name: API_KEY
      valueFrom: {secretKeyRef: {name: dify-app, key: SANDBOX_API_KEY}}

pluginDaemon:
  # The chart defines no probes for the plugin daemon
  customReadinessProbe:
    httpGet: {path: /health/check, port: 5002}
    initialDelaySeconds: 10
    periodSeconds: 10
  customLivenessProbe:
    tcpSocket: {port: 5002}
    initialDelaySeconds: 30
    periodSeconds: 30
  resources:
    requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
    limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 4Gi}
  containerSecurityContext:
    allowPrivilegeEscalation: false
  extraEnv:
    - name: DB_PASSWORD
      valueFrom: {secretKeyRef: {name: dify-secret, key: password}}
    - name: REDIS_PASSWORD
      valueFrom: {secretKeyRef: {name: dify-redis, key: REDIS_PASSWORD}}
    - name: SERVER_KEY
      valueFrom: {secretKeyRef: {name: dify-app, key: PLUGIN_DAEMON_KEY}}
    - name: DIFY_INNER_API_KEY
      valueFrom: {secretKeyRef: {name: dify-app, key: PLUGIN_INNER_API_KEY}}
  persistence:
    persistentVolumeClaim:
      storageClass: cephfs

# Routing is done by our own Contour Ingress (ingress.yaml), not the chart's nginx
proxy:
  enabled: false
# Not needed for the core app; enabling them needs their secrets wired up too
agentBackend:
  enabled: false
localSandbox:
  enabled: false

# Postgres and pgvector come from the CNPG cluster (cnpg.yaml)
postgresql:
  enabled: false
weaviate:
  enabled: false
externalPostgres:
  enabled: true
  username: dify
  address: cnpg-rw
  port: 5432
  database:
    api: dify
    pluginDaemon: dify_plugin_daemon
externalPgvector:
  enabled: true
  username: dify
  address: cnpg-rw
  port: 5432
  dbName: dify

redis:
  enabled: true
  architecture: standalone
  commonAnnotations: *kubeScoreIgnore
  image:
    pullPolicy: Always
  auth:
    existingSecret: dify-redis
    existingSecretPasswordKey: REDIS_PASSWORD
  master:
    resources:
      requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 256Mi}
      limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 512Mi}
    persistence:
      storageClass: cephfs
      size: 2Gi
