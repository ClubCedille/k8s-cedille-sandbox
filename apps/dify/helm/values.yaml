# Default values for dify.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
global:
  # -- The edition of the application, SELF_HOSTED or CLOUD
  edition: "SELF_HOSTED"
  # -- A secret key that is used for securely signing the session cookie and encrypting sensitive information on the database. You can generate a strong key using `openssl rand -base64 42`.
  appSecretKey: "#REPLACE_ME#"  # vault-secret for prod
  # -- secret key for inner api calls. You can generate a strong key using `openssl rand -base64 42`.
  innerApiKey: "#REPLACE_ME#"
  useTLS: true
  # -- External port for accessing services (default: 80).
  # Browser uses port 443 for HTTPS (useTLS: true) unless explicitly overridden.
  # Set to a non-standard port (e.g., 8443 for HTTPS, 8080 for HTTP) when needed.
  externalPort: 443
  # -- The backend domain of the console API, used to concatenate the authorization callback.
  # If empty, it is the same domain. Example: console.dify.ai
  consoleApiDomain: "dify.sandbox.cedille.club"
  # -- The front-end domain of the console web, used to concatenate some front-end addresses and for CORS configuration use.
  # If empty, it is the same domain. Example: console.dify.ai
  consoleWebDomain: "dify.sandbox.cedille.club"
  # -- Service API domain, used to display Service API Base Url to the front-end.
  # If empty, it is the same domain. Example: api.dify.ai
  serviceApiDomain: "dify.sandbox.cedille.club"
  # -- WebApp API backend domain, used to declare the back-end URL for the front-end API.
  # If empty, it is the same domain. Example: app.dify.ai
  appApiDomain: "dify.sandbox.cedille.club"
  # -- WebApp domain, used to display WebAPP API Base Url to the front-end. If empty, it is the same domain. Example: app.dify.ai
  appWebDomain: "dify.sandbox.cedille.club"
  # -- File preview or download domain, used to display the file preview
  # or download URL to the front-end or as a multi-modal model input;
  # In order to prevent others from forging, the image preview URL is signed and has a 5-minute expiration time.
  filesDomain: "dify.sandbox.cedille.club"
  # -- Enterprise service domain, used to declare the back-end URL for the front-end API.
  enterpriseDomain: ""
  # -- Trigger service domain, used by API and workers for trigger functionality.
  # If empty, trigger functionality may not work properly. Example: trigger.dify.ai
  triggerDomain: "dify.sandbox.cedille.club"
  # -- This is useful if plugins are installed in a different cluster.
  # If left empty, internal service domain will be used.
  pluginDaemonDomain: ""
  # -- When enabled, migrations will be executed prior to application startup and the application will start after the migrations have completed.
  dbMigrationEnabled: true
  rag:
    # -- RAG ETL type, support: dify or Unstructured
    etlType: "dify"
    keywordDataSourceType: "object_storage"
    # -- The maximum number of top-k value for RAG.
    topKMaxValue: 10
    # -- Configuration for document chunk length. It is used to control the size of text segments when processing long documents.
    indexingMaxSegmentationTokensLength: 4000
  integrations:
    notion:
      # -- Notion import configuration, support public and internal
      integrationType: "internal"
      # -- Notion OAuth client ID
      clientId: ""
      # -- Notion OAuth client secret
      clientSecret: ""
      internalSecret: ""
  marketplace:
    # -- Enable this component
    enabled: true
    url: "https://marketplace.dify.ai"
    apiUrl: "https://marketplace.dify.ai"
  # -- Plugin DR - cross-cluster plugin synchronization
  pluginDr:
    # -- Enable this component
    enabled: false
  log:
    outputFormat: "json"
  # When external secret is enabled, the secret won't be generated by the chart.
  # instead, an external secret will be used.
  externalSecret:
    enabled: false
    secretStoreRef:
      name: ""
      # Kind of the referenced store: SecretStore (namespaced) or
      # ClusterSecretStore (cluster-scoped).
      kind: "SecretStore"
    # Remote secret key name in the external provider (default: dify)
    remoteKey: "dify"
  otel:
    # -- Requires enterpriseCollector.enabled to be true
    enabled: false
    # -- Sampling rate (0.0 to 1.0, empty means default)
    samplingRate: "0.2"
    # -- Batch export schedule delay in milliseconds
    batchExportScheduleDelay: "5000"
    # -- Maximum queue size for batching
    maxQueueSize: "2048"
    # -- Maximum export batch size
    maxExportBatchSize: "512"
    # -- Metric export interval in milliseconds
    metricExportInterval: "60000"
    # -- Batch export timeout in milliseconds
    batchExportTimeout: "30000"
    # -- Metric export timeout in milliseconds
    metricExportTimeout: "30000"

    sender:
      otlp:
        # -- Custom headers for OTLP requests (key=value,key2=value2)
        headers: ""

      # -- Service name reported to OTEL collector
      serviceName: "dify-api-otel"

      # -- Include input/output content in traces (privacy toggle)
      includeContent: false
  customCA:
    # -- Custom CA certificate configuration for environments with self-signed or private CA certificates
    enabled: false
    # -- Name of existing Kubernetes secret containing the CA certificate
    # NOTE: Changes to the custom CA secret require pod restart to take effect,
    # as the combined CA bundle is generated once during pod initialization by an initContainer
    existingSecret: ""
    # -- Key name in the secret that contains the CA certificate
    key: ca.crt
    # -- Mount path for the combined CA bundle
    mountPath: /etc/dify/custom-ca
    # -- Init container image used to combine system CAs with custom CA certificate
    # For enterprise environments without public registry access, replace with your private registry image
    # The image must contain either /etc/ssl/certs/ca-certificates.crt (Debian/Ubuntu) or /etc/ssl/cert.pem (Alpine)
    # Examples:
    # - alpine:3.20 (default, requires Docker Hub access)
    # - your-registry.company.com/alpine:3.20 (private registry mirror)
    # - your-registry.company.com/ubuntu:22.04 (Debian-based alternative)
    initImage: alpine:3.20
  # -- Extra labels applied to all Dify workload Pods (Deployment pod templates). Ignored when empty.
  podLabels: {}

ingress:
  # -- Enable this component
  enabled: false
  # -- Use the IP address as the host name, which is used to access the service through the IP address.
  # ! Only support non-enterprise version !
  useIpAsHost: false
  # -- Ingress class name
  className: ""
  # -- Custom annotations
  annotations: {}
  # -- kubernetes.io/tls-acme: "true"
  tls: []

api:
  # -- Enable this component
  enabled: true
  # -- https://github.com/langgenius/dify/commit/3d2aea11a30200d6bf4be3033b6b1ff63bb87ffc
  image:
    # -- g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-api
    repository: langgenius/dify-ee-api
    # override appVersion in Chart.yaml if not empty
    tag: "3.12.1"
  replicas: 1
  # -- Resource requests and limits
  resources: {}
  # -- Service account name
  serviceAccountName: ""
  # -- Node selector for pod scheduling
  nodeSelector: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # -- Tolerations for pod scheduling
  tolerations: []
  # -- Probe settings adjusted for database migration time
  readinessProbe:
    httpGet:
      path: /health
      port: 5001
      scheme: HTTP
    initialDelaySeconds: 120
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    failureThreshold: 30
  # -- Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /health
      port: 5001
      scheme: HTTP
    initialDelaySeconds: 300 # 5 minutes for migration
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    failureThreshold: 3
  # -- Apply your own Environment Variables if necessary. Below is demo.
  # @raw
  # extraEnv:
  # - name: ENV_FROM_COMMUNITY1
  #   value: env123
  # - name: ENV_FROM_COMMUNITY2
  #   value: env123
  extraEnv: []

  # -- Deployment environment
  deployEnv: "PRODUCTION"
  # -- CORS allowed origins for Web API
  webApiCorsAllowOrigins: "*"
  # -- CORS allowed origins for Console API
  consoleCorsAllowOrigins: "*"
  # -- Number of server workers
  serverWorkerAmount: 1
  # -- URL for update checking
  checkUpdateUrl: "https://updates.dify.ai"
  # -- Inner API configuration
  innerApi:
    # -- Enable this component
    enabled: true
  # -- OAuth configuration
  oauth:
    # -- OAuth redirect path
    redirectPath: "/console/api/oauth/authorize"
    github:
      # -- OAuth client ID
      clientId: ""
      # -- OAuth client secret
      clientSecret: ""
    google:
      # -- OAuth client ID
      clientId: ""
      # -- OAuth client secret
      clientSecret: ""
  # -- OpenAPI endpoint configuration
  openapi:
    # -- Enable the /openapi/v1/* endpoint group (difyctl and other programmatic clients).
    # When false, the Caddy route is also suppressed — no traffic reaches the app.
    enabled: false
    # -- Comma-separated CORS origins for /openapi/v1/*. Empty = same-origin only.
    corsAllowOrigins: ""
    # -- Comma-separated client_id values accepted at POST /openapi/v1/oauth/device/code.
    # Unknown client_id returns 400 unsupported_client.
    knownClientIds: "difyctl"
    # -- Per-token rate limit on /openapi/v1/* (requests per minute).
    # Bucket keyed on sha256(token), shared across replicas via Redis.
    rateLimitPerToken: 60

  # -- Enable OAuth bearer middleware (device-flow tokens + Service API /v1/* bearer).
  enableOauthBearer: true
  # -- Database configuration
  db:
    # -- Database connection pool size
    poolSize: 250
    # -- Database connection pool recycle time in seconds
    poolRecycle: 3600
  # -- Rate limits and file size limits
  limits:
    # -- upload file size limit in MB
    uploadFileSize: 15
    # -- upload file batch count limit
    uploadFileBatchCount: 5
    # -- upload image file size limit in MB
    uploadImageFileSize: 5
  # -- Sentry error tracking configuration
  sentry:
    # -- Enable this component
    enabled: false
    # -- Sentry DSN
    dsn: ""
    # -- Sentry traces sample rate
    tracesSampleRate: 1.0
    # -- Sentry profiles sample rate
    profilesSampleRate: 1.0
  positionTool:
    # -- Pinned tools
    pins: ""
    # -- Included tools
    includes: ""
    # -- Excluded tools
    excludes: ""
  positionProvider:
    # -- Pinned tools
    pins: ""
    # -- Included tools
    includes: ""
    # -- Excluded tools
    excludes: ""

# Workflow collaboration (multiplayer editing over Socket.IO). Drives the
# dedicated websocket deployment/service, /socket.io gateway routing, and
# collaboration envs on api and web. Scales horizontally (rooms shared via
# Redis pub/sub); each editor tab holds one connection slot.
collaboration:
  # -- Enable this component
  enabled: false
  websocket:
    # -- Number of replicas
    replicas: 1
    # -- Number of server workers
    serverWorkerAmount: 1
    serverWorkerConnections: 1000
    gunicornTimeout: 360
    # -- Resource requests and limits
    resources: {}

worker:
  # -- Enable this component
  enabled: true
  # -- https://github.com/langgenius/dify/commit/3d2aea11a30200d6bf4be3033b6b1ff63bb87ffc
  image:
    # -- g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-api
    repository: langgenius/dify-ee-api
    # override appVersion in Chart.yaml if not empty
    tag: "3.12.1"
  replicas: 1
  # -- Resource requests and limits
  resources: {}
  # -- Service account name
  serviceAccountName: ""
  # -- Node selector for pod scheduling
  nodeSelector: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # -- Tolerations for pod scheduling
  tolerations: []
  # -- Readiness probe configuration
  readinessProbe: {}
  # -- Liveness probe configuration
  livenessProbe: {}
  # -- Celery queue names to consume
  # @notationType -- csv
  celeryQueues: "dataset,priority_dataset,pipeline,priority_pipeline,mail,ops_trace,app_deletion,plugin,workflow_storage,conversation,workflow,workflow_based_app_execution,api_token,schedule_poller,schedule_executor,triggered_workflow_dispatcher,trigger_refresh_executor,retention,enterprise_telemetry,trigger_refresh_publisher,dataset_summary,app_rbac"
  extraEnv:
  # Apply your own Environment Variables if necessary. Below is demo.
  # extraEnv:
  #   - name: ENV_FROM_COMMUNITY1
  #     value: env123
  #   - name: ENV_FROM_COMMUNITY2
  #     value: env123
  celeryWorkerAmount: 1
  # -- Database configuration
  db:
    # -- Database connection pool size
    poolSize: 250
    # -- Database connection pool recycle time in seconds
    poolRecycle: 3600
  # -- Sentry error tracking configuration
  sentry:
    # -- Enable this component
    enabled: false
    # -- Sentry DSN
    dsn: ""
    # -- Sentry traces sample rate
    tracesSampleRate: 1.0
    # -- Sentry profiles sample rate
    profilesSampleRate: 1.0

# Additional workers allow splitting the monolithic worker into specialized workers,
# each handling specific Celery task queues. This enables independent scaling per workload type.
#
# By default, the main 'worker' above handles ALL queues. To split workers:
# 1. Set worker.enabled=false to disable the catch-all worker
# 2. Enable the additional workers below (set enabled: true)
#
# Each worker creates its own Deployment, ConfigMap, and Secret.
additionalWorkers:
  # -- Dataset & RAG pipeline processing
  - name: dataset-worker
    # -- Enable this component
    enabled: false
    # -- Number of replicas
    replicas: 1
    # -- Celery queue names to consume
    # @notationType -- csv
    celeryQueues: "dataset,priority_dataset,pipeline,priority_pipeline,dataset_summary"
    celeryWorkerAmount: 4
    # -- Resource requests and limits
    resources: {}
    # -- Node selector for pod scheduling
    nodeSelector: {}
    # -- Affinity rules for pod scheduling
    affinity: {}
    # -- Tolerations for pod scheduling
    tolerations: []
    # -- Extra environment variables
    extraEnv: []

  # -- Workflow execution
  - name: workflow-worker
    # -- Enable this component
    enabled: false
    # -- Number of replicas
    replicas: 1
    # -- Celery queue names to consume
    # @notationType -- csv
    celeryQueues: "workflow,workflow_storage,workflow_based_app_execution"
    # -- Number of Celery worker processes
    celeryWorkerAmount: 2
    # -- Resource requests and limits
    resources: {}
    # -- Node selector for pod scheduling
    nodeSelector: {}
    # -- Affinity rules for pod scheduling
    affinity: {}
    # -- Tolerations for pod scheduling
    tolerations: []
    # -- Extra environment variables
    extraEnv: []

  # -- Lightweight background tasks
  - name: general-worker
    # -- Enable this component
    enabled: false
    # -- Number of replicas
    replicas: 1
    # -- Celery queue names to consume
    # @notationType -- csv
    celeryQueues: "mail,ops_trace,app_deletion,conversation,api_token,plugin,retention,enterprise_telemetry,app_rbac"
    celeryWorkerAmount: 1
    # -- Resource requests and limits
    resources: {}
    # -- Node selector for pod scheduling
    nodeSelector: {}
    # -- Affinity rules for pod scheduling
    affinity: {}
    # -- Tolerations for pod scheduling
    tolerations: []
    # -- Extra environment variables
    extraEnv: []

  # -- Trigger worker
  - name: trigger-worker
    # -- Enable this component
    enabled: true
    # -- Number of replicas
    replicas: 1
    # -- Celery queue names to consume
    # @notationType -- csv
    celeryQueues: "schedule_poller,schedule_executor,triggered_workflow_dispatcher,trigger_refresh_executor,trigger_refresh_publisher"
    # -- Number of Celery worker processes
    celeryWorkerAmount: 1
    # -- Resource requests and limits
    resources: {}
    # -- Node selector for pod scheduling
    nodeSelector: {}
    # -- Affinity rules for pod scheduling
    affinity: {}
    # -- Tolerations for pod scheduling
    tolerations: []
    # -- Extra environment variables
    extraEnv: []

workerBeat:
  # -- Enable this component
  enabled: true
  # -- https://github.com/langgenius/dify/commit/3d2aea11a30200d6bf4be3033b6b1ff63bb87ffc
  image:
    # -- g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-api
    repository: langgenius/dify-ee-api
    # override appVersion in Chart.yaml if not empty
    tag: "3.12.1"
  resources: {}
  # -- Service account name
  serviceAccountName: ""
  # -- Node selector for pod scheduling
  nodeSelector: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # -- Tolerations for pod scheduling
  tolerations: []
  # -- Readiness probe configuration
  readinessProbe: {}
  # -- Liveness probe configuration
  livenessProbe: {}
  # -- Apply your own Environment Variables if necessary. Below is demo.
  # @raw
  # extraEnv:
  # - name: ENV_FROM_COMMUNITY1
  #   value: env123
  # - name: ENV_FROM_COMMUNITY2
  #   value: env123
  extraEnv: []

  # -- Database configuration
  db:
    # -- Database connection pool size
    poolSize: 30
    # -- Database connection pool recycle time in seconds
    poolRecycle: 3600
  # -- Enable workflow log cleanup
  enableWorkflowLogCleanup: false

web:
  # -- Enable this component
  enabled: true
  # -- https://github.com/langgenius/dify/commit/3d2aea11a30200d6bf4be3033b6b1ff63bb87ffc
  image:
    # -- g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-web
    repository: langgenius/dify-ee-web
    # override appVersion in Chart.yaml if not empty
    tag: "3.12.1"
  logoConfig:
    # -- Enable this component
    enabled: false
    # -- Container image configuration
    image:
      # -- Container image repository
      repository: busybox
      # -- Image tag (overrides appVersion if non-empty)
      tag: "1.36.1"
    # -- Base64-encoded favicon (ICO format)
    faviconIcoBase64: ""
    # -- Base64-encoded site logo (PNG format)
    logoSitePngBase64: ""
  # -- Number of replicas
  replicas: 1
  # -- Resource requests and limits
  resources: {}
  # -- Service account name
  serviceAccountName: ""
  # -- Node selector for pod scheduling
  nodeSelector: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # -- Tolerations for pod scheduling
  tolerations: []
  # -- Readiness probe configuration
  readinessProbe:
    initialDelaySeconds: 3
    failureThreshold: 3
    periodSeconds: 10
    successThreshold: 1
    tcpSocket:
      port: 3000
    timeoutSeconds: 1
  # -- Liveness probe configuration
  livenessProbe:
    failureThreshold: 3
    periodSeconds: 10
    successThreshold: 1
    tcpSocket:
      port: 3000
    timeoutSeconds: 1
  # -- Apply your own Environment Variables if necessary. Below is demo.
  # @raw
  # extraEnv:
  # - name: ENV_FROM_COMMUNITY1
  #   value: env123
  # - name: ENV_FROM_COMMUNITY2
  #   value: env123
  extraEnv: []

  # -- Sentry error tracking configuration
  sentry:
    # -- Enable this component
    enabled: false
    # -- Sentry DSN
    dsn: ""
    # -- Sentry traces sample rate
    tracesSampleRate: 1.0
    # -- Sentry profiles sample rate
    profilesSampleRate: 1.0

agentBackend:
  # -- Enable this component
  enabled: true
  # -- Container image configuration
  image:
    # -- Container image repository
    repository: langgenius/dify-ee-agent-backend
    # -- Image tag (overrides appVersion if non-empty)
    tag: "3.12.1"
  # -- Number of replicas
  replicas: 1
  # -- Resource requests and limits
  resources: {}
  # -- Service account name
  serviceAccountName: ""
  # -- Node selector for pod scheduling
  nodeSelector: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # -- Tolerations for pod scheduling
  tolerations: []
  # -- Readiness probe configuration
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    tcpSocket:
      port: 5050
    timeoutSeconds: 3
  # -- Liveness probe configuration
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    tcpSocket:
      port: 5050
    timeoutSeconds: 3
  # -- Extra environment variables
  extraEnv: []
  # -- Redis key prefix
  redisPrefix: "dify-agent"
  # -- Grace period for shutdown in seconds
  shutdownGraceSeconds: 30
  # -- Agent run retention period in seconds
  runRetentionSeconds: 259200
  # -- Base64url-encoded 32-byte secret for DIFY_AGENT_SERVER_SECRET_KEY.
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  serverSecretKey: S1CifQNbgXXC_uVENGDlQ8gvHeLetqg8nLxlzlCuLWA

sandbox:
  # -- Enable this component
  enabled: true
  # -- Container image configuration
  image:
    # -- g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-sandbox
    repository: langgenius/dify-ee-sandbox
    tag: "3.12.1"
  replicas: 1
  # -- Resource requests and limits
  resources: {}
  # -- Service account name
  serviceAccountName: ""
  # -- Node selector for pod scheduling
  nodeSelector: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # -- Tolerations for pod scheduling
  tolerations: []
  # -- Container-level securityContext for the sandbox container. Empty by default,
  # so the cluster's own defaults apply and nothing is granted implicitly.
  # dify-sandbox calls chroot() before running user code, which requires the
  # SYS_CHROOT capability. On clusters that drop capabilities (restricted Pod
  # Security Standards, hardened runtimes) Code nodes fail with
  # "operation not permitted" until SYS_CHROOT is added back here.
  # Adding SYS_CHROOT widens what the sandbox container can do — evaluate it
  # against your own security policy before enabling.
  # @raw
  # securityContext:
  #   allowPrivilegeEscalation: false
  #   capabilities:
  #     drop: ["ALL"]
  #     add: ["SYS_CHROOT"]
  #   seccompProfile:
  #     type: RuntimeDefault
  securityContext: {}
  # -- Pod-level securityContext for the sandbox pod.
  # @raw
  # podSecurityContext:
  #   runAsUser: 1000
  #   fsGroup: 1000
  podSecurityContext: {}
  # -- Readiness probe configuration
  readinessProbe:
    failureThreshold: 60
    initialDelaySeconds: 3
    periodSeconds: 3
    successThreshold: 1
    tcpSocket:
      port: 8194
    timeoutSeconds: 3
  # -- Liveness probe configuration
  livenessProbe:
    failureThreshold: 3
    periodSeconds: 3
    successThreshold: 1
    tcpSocket:
      port: 8194
    timeoutSeconds: 1
  # -- Apply your own Environment Variables if necessary. Below is demo.
  # @raw
  # extraEnv:
  # - name: ENV_FROM_COMMUNITY1
  #   value: env123
  # - name: ENV_FROM_COMMUNITY2
  #   value: env123
  extraEnv: []

  # -- Maximum worker processes
  maxWorkers: 4
  # -- Maximum concurrent requests
  maxRequests: 50
  # -- Worker timeout in seconds
  workerTimeout: 15
  # -- Python packages to install in sandbox
  pythonRequirements: |
    # -- The requirements.txt file content
    # For example:
    # fastapi==0.104.1
    # pydantic==2.5.1
sandboxGateway:
  # Agent Sandbox Gateway. Requires the agent-sandbox controller and its CRDs
  # (extensions.agents.x-k8s.io: SandboxClaim/SandboxTemplate/SandboxWarmPool,
  #  agents.x-k8s.io: Sandbox) to be installed in the cluster. Disabled by default.
  # In order to support network policy, the minimum version of control plane is v0.5.2
  enabled: false
  image:
    repository: langgenius/dify-ee-agent-sandbox-gateway
    tag: "3.12.1"
  replicas: 1
  # -- Resource requests and limits
  resources: {}
  # -- If empty, the chart creates a ServiceAccount named
  # "<fullname>-sandbox-gateway" (see rbac.create below).
  serviceAccountName: ""
  rbac:
    # -- Create the ServiceAccount + Role + RoleBinding granting access to the
    # agent-sandbox CRs and coordination leases in `namespace`.
    create: true
  # -- Node selector for pod scheduling
  nodeSelector: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # -- Tolerations for pod scheduling
  tolerations: []
  # -- Readiness probe configuration
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 20
    periodSeconds: 10
    successThreshold: 1
    tcpSocket:
      port: 8090
    timeoutSeconds: 3
  # -- Liveness probe configuration
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    tcpSocket:
      port: 8090
    timeoutSeconds: 3
  # -- Apply your own Environment Variables if necessary. Below is demo.
  # @raw
  # extraEnv:
  # - name: ENV_FROM_COMMUNITY1
  #   value: env123
  extraEnv: []
  # -- Server timeout in seconds
  serverTimeout: "60s"
  # -- gRPC server timeout in seconds
  grpcServerTimeout: "60s"
  # -- Namespace where the sandbox warm pool and claims live. Defaults to the
  # release namespace when left empty.
  namespace: ""
  # -- Default sandbox template
  defaultTemplate: "dify-sandbox"
  # -- Warm pool name for sandbox gateway
  warmPoolName: "dify-sandbox-warmpool"
  # -- Inner API secret key for authenticating requests from dify-api. Defaults to
  # global.innerApiKey when left empty.
  innerApiSecretKey: ""
  # -- Sandbox ready timeout in seconds
  sandboxReadyTimeout: "180s"
  # -- Execution timeout in seconds
  execTimeout: "300s"
  # -- sandboxes are garbage collected after a configured inactive period
  inactiveTtl: "360s"
  # -- Provisioning config for the managed SandboxTemplate + SandboxWarmPool that
  # the gateway reconciles at startup.
  provision:
    # -- When true, the Helm chart creates SandboxTemplate + SandboxWarmPool CRs
    managedByHelm: true
    warmPoolReplicas: 1
    requestsCpu: "250m"
    requestsMemory: "256Mi"
    limitsCpu: "1"
    limitsMemory: "1Gi"
    # Ephemeral storage requests/limits for the sandbox container.
    # requestsEphemeralStorage: "1Gi"
    # limitsEphemeralStorage: "5Gi"

    # -- Extra environment variables injected into the sandbox container.
    extraEnv: []
    # -- VolumeClaimTemplates for the sandbox pod. Each entry creates a PVC that is mounted into the sandbox container.
    # @raw
    # volumeClaimTemplates:
    #   - metadata:
    #       name: workspace
    #     spec:
    #       accessModes: ["ReadWriteOnce"]
    #       resources:
    #         requests:
    #           storage: 10Gi
    #       storageClassName: standard
    volumeClaimTemplates: []
    # -- Container-level securityContext for the sandbox pod. Uncomment and configure if your cluster enforces Pod Security Standards.
    # @raw
    # securityContext:
    #   runAsNonRoot: true
    #   allowPrivilegeEscalation: false
    #   capabilities:
    #     drop: ["ALL"]
    #   seccompProfile:
    #     type: RuntimeDefault
    securityContext: {}
    # -- Pod-level securityContext for the sandbox pod.
    # @raw
    # podSecurityContext:
    #   runAsNonRoot: true
    #   runAsUser: 1000
    #   fsGroup: 1000
    podSecurityContext: {}
    # -- the maximum lifetime of a sandbox
    sandboxTtl: 1800s
    # -- DNS policy for the sandbox pod. One of: ClusterFirst,
    # ClusterFirstWithHostNet, Default, None. Defaults to ClusterFirst.
    dnsPolicy: "ClusterFirst"
    # -- Network policy for sandbox pods. When enabled, custom egress/ingress rules
    # are applied to the SandboxTemplate. By default sandbox can access
    # agent-backend (port 5050), dify-api (port 5001), DNS, and external internet
    # and be accessed by sandbox-gateway
    networkPolicy:
      # -- Render a custom networkPolicy in the SandboxTemplate.
      # When false the controller Secure Default applies (public internet only,
      # blocks RFC1918 internal IPs).
      enabled: true
      # -- "Managed" (controller enforces) or "Unmanaged" (skip NetworkPolicy entirely).
      management: "Managed"
      # -- Allow sandbox pods to reach external internet (non-RFC1918).
      allowExternalEgress: true
      # -- Extra egress rules appended after the defaults (DNS, agent-backend, dify-api, external).
      extraEgressRules: []
      # -- Extra ingress rules appended after the defaults.
      extraIngressRules: []

  # SSRF Proxy for sandbox pods. Forces all sandbox HTTP traffic through Squid.
  ssrfProxy:
    replicas: 1
    image:
      repository: ubuntu/squid
      tag: latest
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # -- Squid configuration for the sandbox gateway SSRF proxy
    squidConf: |
      include /etc/squid/common/common.conf
      acl dst_dify_api dstdomain {{ template "dify.fullname" . }}-api-svc {{ template "dify.fullname" . }}-api-svc.{{ .Release.Namespace }}.svc {{ template "dify.fullname" . }}-api-svc.{{ .Release.Namespace }}.svc.cluster.local
      acl dst_dify_api_port port 5001
      acl dst_agent_backend dstdomain {{ template "dify.fullname" . }}-agent-backend-svc {{ template "dify.fullname" . }}-agent-backend-svc.{{ .Release.Namespace }}.svc {{ template "dify.fullname" . }}-agent-backend-svc.{{ .Release.Namespace }}.svc.cluster.local
      acl dst_agent_backend_port port 5050
      acl path_files urlpath_regex ^/files/
      acl path_agent_stub urlpath_regex ^/agent-stub/
      http_access allow dst_dify_api dst_dify_api_port path_files
      http_access allow dst_agent_backend dst_agent_backend_port path_agent_stub
      # Deny any other access to internal Dify services
      http_access deny dst_dify_api
      http_access deny dst_agent_backend
      # Block access to private/internal IPs (SSRF protection)
      http_access deny private_dst
      # Allow external internet access. Change to "http_access deny all" to
      # block all outbound traffic except the whitelisted paths above.
      http_access allow all
      http_port 3128

