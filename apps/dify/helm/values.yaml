# Overrides for the official dify chart (langgenius/dify-helm, version pinned in
# ../kustomization.yaml). Only what differs from the chart defaults lives here;
# everything else comes from the chart itself:
#   helm show values dify --repo https://langgenius.github.io/dify-helm --version 3.12.1

global:
  # Placeholder so the chart's generated Secrets don't carry its public default key;
  # real keys come from Vault via extraEnv below
  innerApiKey: "#REPLACE_ME#"
  useTLS: true
  externalPort: 443
  consoleApiDomain: dify.sandbox.cedille.club
  consoleWebDomain: dify.sandbox.cedille.club
  serviceApiDomain: dify.sandbox.cedille.club
  appApiDomain: dify.sandbox.cedille.club
  appWebDomain: dify.sandbox.cedille.club
  filesDomain: dify.sandbox.cedille.club
  triggerDomain: dify.sandbox.cedille.club
  otel:
    enabled: false

# Enterprise components (the rest are disabled in ../overrides.yaml)
enterprise:
  enabled: false
enterpriseCollector:
  enabled: false
enterpriseAudit:
  enabled: false
enterpriseFrontend:
  enabled: false
enterpriseRbac:
  enabled: false

api:
  resources:
    requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
    limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
  # TCP liveness vs the chart's HTTP readiness, so kube-score sees distinct probes;
  # null removes the chart default httpGet (a probe allows only one handler)
  livenessProbe:
    httpGet: null
    tcpSocket:
      port: 5001
  # Credentials from Vault (../prod/vault.yaml). `env` beats the chart's own Secrets
  # (loaded with envFrom), which only hold placeholders. Shared with worker,
  # trigger-worker and workerBeat. $(VAR) only expands variables defined earlier
  # in the list, so REDIS_PASSWORD comes before CELERY_BROKER_URL.
  extraEnv: &vaultAppEnv
    - name: SECRET_KEY
      valueFrom: {secretKeyRef: {name: dify-vault-app, key: SECRET_KEY}}
    - name: INNER_API_KEY
      valueFrom: {secretKeyRef: {name: dify-vault-app, key: INNER_API_KEY}}
    - name: DB_PASSWORD
      valueFrom: {secretKeyRef: {name: dify-vault-db, key: password}}
    - name: PGVECTOR_PASSWORD
      valueFrom: {secretKeyRef: {name: dify-vault-db, key: password}}
    - name: REDIS_PASSWORD
      valueFrom: {secretKeyRef: {name: dify-vault-redis, key: REDIS_PASSWORD}}
    - name: CELERY_BROKER_URL
      value: redis://:$(REDIS_PASSWORD)@dify-redis-master:6379/1
    - name: CODE_EXECUTION_API_KEY
      valueFrom: {secretKeyRef: {name: dify-vault-app, key: SANDBOX_API_KEY}}
    - name: PLUGIN_DAEMON_KEY
      valueFrom: {secretKeyRef: {name: dify-vault-app, key: PLUGIN_DAEMON_KEY}}
    - name: INNER_API_KEY_FOR_PLUGIN
      valueFrom: {secretKeyRef: {name: dify-vault-app, key: PLUGIN_DIFY_INNER_API_KEY}}

worker:
  resources:
    requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
    limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 2Gi}
  extraEnv: *vaultAppEnv

# A list replaces the chart default instead of merging. Only trigger-worker is
# enabled by default (the other additional workers render nothing), so it's the
# only entry restated here.
additionalWorkers:
  - name: trigger-worker
    enabled: true
    replicas: 1
    celeryQueues: "schedule_poller,schedule_executor,triggered_workflow_dispatcher,trigger_refresh_executor,trigger_refresh_publisher"
    celeryWorkerAmount: 1
    resources:
      requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi}
      limits: {cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi}
    nodeSelector: {}
    affinity: {}
    tolerations: []
    extraEnv: *vaultAppEnv

workerBeat:
  resources:
    requests: {cpu: 50m, memory: 256Mi, ephemeral-storage: 512Mi}
    limits: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
  extraEnv: *vaultAppEnv

web:
  resources:
    requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 512Mi}
    limits: {cpu: 500m, memory: 1Gi, ephemeral-storage: 1Gi}
  # HTTP readiness on a static asset vs the chart's TCP liveness, so the probes
  # differ; null removes the chart default tcpSocket
  readinessProbe:
    tcpSocket: null
    httpGet:
      path: /favicon.ico
      port: 3000
    timeoutSeconds: 3

sandbox:
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 512Mi}
    limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 1Gi}
  # Stays root (needed for chroot)
  securityContext:
    allowPrivilegeEscalation: false
  # HTTP readiness vs the chart's TCP liveness, so the probes differ
  readinessProbe:
    tcpSocket: null
    httpGet:
      path: /health
      port: 8194
  # Same key as the api's CODE_EXECUTION_API_KEY
  extraEnv:
    - name: API_KEY
      valueFrom: {secretKeyRef: {name: dify-vault-app, key: SANDBOX_API_KEY}}

sandboxGateway:
  ssrfProxy:
    image:
      # pinned (same as ssrfProxy) so kube-score doesn't flag the latest tag
      tag: "6.13-25.04_beta"
    resources:
      requests: {ephemeral-storage: 256Mi}
      limits: {ephemeral-storage: 512Mi}

ssrfProxy:
  resources:
    requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 256Mi}
    limits: {cpu: 200m, memory: 256Mi, ephemeral-storage: 512Mi}
  # No liveness probe: squid only exposes a TCP port, and the same TCP check
  # for both would trip kube-score's identical-probe check
  readinessProbe:
    tcpSocket:
      port: 3128
    initialDelaySeconds: 5
    periodSeconds: 10

plugin_daemon:
  resources:
    requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
    limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 4Gi}
  # Credentials from Vault. SERVER_KEY and DIFY_INNER_API_KEY match the api's
  # PLUGIN_DAEMON_KEY and INNER_API_KEY_FOR_PLUGIN.
  # DIFY_PLUGIN_SERVERLESS_CONNECTOR_API_KEY is left to the chart: it must match
  # plugin-connector, which has no extraEnv.
  extraEnv:
    - name: DB_PASSWORD
      valueFrom: {secretKeyRef: {name: dify-vault-db, key: password}}
    - name: REDIS_PASSWORD
      valueFrom: {secretKeyRef: {name: dify-vault-redis, key: REDIS_PASSWORD}}
    - name: SERVER_KEY
      valueFrom: {secretKeyRef: {name: dify-vault-app, key: PLUGIN_DAEMON_KEY}}
    - name: DIFY_INNER_API_KEY
      valueFrom: {secretKeyRef: {name: dify-vault-app, key: PLUGIN_DIFY_INNER_API_KEY}}
    - name: ADMIN_API_KEY
      valueFrom: {secretKeyRef: {name: dify-vault-app, key: PLUGIN_ADMIN_API_KEY}}

# Deployed as dify-crd-controller; runs the serverless plugin runtime
plugin_controller:
  resources:
    requests: {cpu: 50m, memory: 64Mi, ephemeral-storage: 128Mi}
    limits: {cpu: 200m, memory: 256Mi, ephemeral-storage: 256Mi}

plugin_connector:
  resources:
    requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 256Mi}
    limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 1Gi}

redis:
  image:
    pullPolicy: Always
  master:
    # UID/GID >= 10000 for kube-score; fsGroup makes the PVC writable for it
    podSecurityContext:
      enabled: true
      fsGroup: 10001
    containerSecurityContext:
      enabled: true
      runAsUser: 10001
      runAsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      # The subchart already mounts /tmp and its config dir as emptyDirs
      readOnlyRootFilesystem: true
    resources:
      requests: {cpu: 50m, memory: 128Mi, ephemeral-storage: 256Mi}
      limits: {cpu: 250m, memory: 256Mi, ephemeral-storage: 512Mi}
