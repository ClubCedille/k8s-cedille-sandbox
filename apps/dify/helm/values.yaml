          python3.14:
            langgenius: docker.io/langgenius/dify-ee-plugin-build-base-python-3.14:3.12.1
          python3.13:
            langgenius: docker.io/langgenius/dify-ee-plugin-build-base-python-3.13:3.12.1
          python3.12:
            langgenius: docker.io/langgenius/dify-ee-plugin-build-base-python-3.12:3.12.1
  pluginDr:
    # -- How often the incremental reconcile loop ticks.
    reconcileInterval: "5s"
    # -- Max rows fetched per reconcile / GC pagination batch.
    reconcileBatchSize: 100
    # -- Interval between full (non-incremental) reconcile sweeps.
    fullReconcileInterval: "1800s"
    # -- Interval between garbage-collection runs.
    gcInterval: "300s"
    # -- Consecutive apply failures before an instance is moved to dead_letter.
    deadLetterThreshold: 5
    # -- How long soft-deleted rows are kept before hard-deletion.
    softDeleteRetention: "86400s"
  # -- External Kubernetes kubeconfig - provide your own secret. See examples/generate-kubeconfig-secret.sh
  kube:
    config:
      secret:
        name: ""
        key: config

gateway:
  # -- Enable this component
  enabled: true
  # -- Number of replicas
  replicas: 1
  # -- Container image configuration
  image:
    # -- g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/enterprise_gateway
    repository: langgenius/dify-ee-gateway
    tag: "3.12.1"
  resources: {}
  # -- Node selector for pod scheduling
  nodeSelector: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # -- Tolerations for pod scheduling
  tolerations: []

  # -- Caddy reverse proxy transport timeouts
  transport:
    dialTimeout: "30s"
    keepalive: "30s"
    keepaliveInterval: "30s"

  # -- additional origins to allow CORS requests from
  # if left empty, only dify domains will be allowed
  allowOrigins:
    - http://localhost:3000
    - http://localhost:3001
    - http://localhost:5001
    - http://localhost:3002
  log:
    # -- Log filter fields for gateway
    filterFields:
      - request>headers>X-Csrf-Token delete

plugin_manager:
  # -- Enable this component
  enabled: true
  # -- Number of replicas
  replicas: 1
  # -- Container image configuration
  image:
    # -- g-hsod9681-docker.pkg.coding.net/dify-artifact/dify/dify-plugin-manager
    repository: langgenius/dify-ee-plugin-manager
    tag: "3.12.1"
  resources: {}
  # -- Node selector for pod scheduling
  nodeSelector: {}
  # -- Affinity rules for pod scheduling
  affinity: {}
  # -- Tolerations for pod scheduling
  tolerations: []
  # -- Server timeout in seconds
  serverTimeout: "60s"
  # -- gRPC server timeout in seconds
  grpcServerTimeout: "60s"
  # -- if disabled, plugin instance management will be disabled on UI
  k8sEnabled: "true"

  # -- Metric source is used for plugin resource (cpu, memory, network i/o) monitoring.
  # can be one of following values:
  # - disabled: no metrics will be collected
  # - cadvisor: metrics will be collected from cadvisor, this requires **cluster roles** of reading nodes and nodes/proxy.
  # the metrics will be stored in a local **ephemeral** tsdb.
  # - (recommended) prometheus: metrics will be queried from prometheus
  # make sure externalPrometheus is enabled and configured correctly.
  #
  # following metrics are required: see https://kubernetes.io/docs/reference/instrumentation/metrics/
  # @raw
  # - container_cpu_usage_seconds_total
  # - container_memory_working_set_bytes
  # - container_network_receive_bytes_total
  # - container_network_transmit_bytes_total
  metric:
    source: "disabled"
    # -- used for cadvisor metric source
    scrape:
      retainPeriod: 604800s
      tsdbBlockSizeLimitBytes: 536870912
      scrapeTimeout: 10s
      scrapeInterval: 20s
      tmpDir: /tmp
  # -- Extra environment variables
  extraEnv: []
  # -- External Kubernetes kubeconfig - provide your own secret. See examples/generate-kubeconfig-secret.sh
  kube:
    config:
      secret:
        name: ""
        key: config

# Persistence Configration
persistence:
  # -- The storage type support: local, s3, azure-blob, aliyun-oss, google-storage, tencent-cos volcengine-tos huawei-obs
  type: "local"
  local:
    mountPath: "/app/api/storage"
    # -- Custom annotations
    annotations:
      helm.sh/resource-policy: keep
    persistentVolumeClaim:
      existingClaim: ""
      hostPath: "/data/dify"
      # -- Dify App Data Persistent Volume Storage Class
      # If defined, storageClassName: <storageClass>
      # If set to "-", storageClassName: "", which disables dynamic provisioning
      # If undefined (the default) or set to null, no storageClassName spec is
      #   set, choosing the default provisioner.
      # ReadWriteMany access mode required for `api` and `worker`
      storageClass:
      # -- Persistence access modes
      accessModes: ReadWriteMany
      # -- Persistence volume size
      size: 5Gi
      subPath: ""
  s3:
    endpoint: "https://xxx.r2.cloudflarestorage.com"
    accessKey: "#REPLACE_ME#"
    secretKey: "#REPLACE_ME#"
    region: "us-east-1"
    bucketName: "your-bucket-name"
    addressType: ""
    useAwsManagedIam: false
    useAwsS3: true
  azureBlob:
    accountName: ""
    accountKey: ""
    containerName: ""
    accountUrl: ""
    # -- Optional Azure EndpointSuffix, e.g. "core.windows.net" or "core.chinacloudapi.cn"
    endpointSuffix: ""
    # -- when using managed identity, make sure the service account of api, worker, audit and plugin daemon are set to
    # aks provided service account
    #
    # also add label `azure.workload.identity/use: "true"` to corresponding pod
    useManagedIdentity: false
  aliyunOss:
    endpoint: "your-endpoint"
    bucketName: "your-bucket-name"
    accessKey: "#REPLACE_ME#"
    secretKey: "#REPLACE_ME#"
    region: "ap-southeast-1"
  googleStorage:
    bucketName: "your-bucket-name"
    # -- The service account JSON key file content, base64 encoded
    serviceAccountJson: ""
  tencentCos:
    bucketName: "your-bucket-name"
    region: ""
    secretId: "#REPLACE_ME"
    secretKey: "#REPLACE_ME"
    scheme: "https"
  huaweiObs:
    server: "your-server-url"
    bucketName: "your-bucket-name"
    accessKey: "#REPLACE_ME#"
    secretKey: "#REPLACE_ME#"
  volcengineTos:
    bucketName: "your-bucket-name"
    accessKey: "#REPLACE_ME#"
    secretKey: "#REPLACE_ME#"
    endpoint: "tos-endpoint"
    region: "your-region"


# Mail Configuration

mail:
  # -- Mail configuration, support: resend, smtp
  type: ""
  # -- default email sender from email address, if not not given specific address
  defaultSender: "YOUR EMAIL FROM (eg: no-reply <no-reply@dify.ai>)"
  # -- the api-key for resend (https://resend.com)
  resend:
    # -- Resend API key (https://resend.com)
    apiKey: ""
    apiUrl: https://api.resend.com
  smtp:
    server: ""
    port: 587
    username: ""
    # -- SMTP server password
    password: ""
    useTLS: false


# External database (Postgres/MySQL/TiDB)

externalDatabase:
  enabled: true
  # postgres | mysql | tidb
  engine: "postgres"
  host: "localhost"
  # -- Default ports: postgres=5432, mysql=3306, tidb=4000
  # Note: when switching engine, remember to update port accordingly
  port: 5432
  user: "postgres"
  # -- PostgreSQL password
  password: "#REPLACE_ME#"
  timezone: "UTC"
  databases:
    dify: "dify"
    plugin_daemon: "dify_plugin_daemon"
    enterprise: "enterprise"
    audit: "audit"
  # -- Per-database credentials (optional).
  # When set (non-empty), overrides global user/password for that logical database.
  # When empty or unset, the application falls back to the global user/password above.
  databaseCredentials:
    dify:
      user: ""
      # -- Password for the dify logical database
      password: ""
    enterprise:
      user: ""
      # -- Password for the enterprise logical database
      password: ""
    audit:
      user: ""
      # -- Password for the audit logical database
      password: ""
    plugin_daemon:
      user: ""
      # -- Password for the plugin_daemon logical database
      password: ""
  dialectOptions:
    postgres:
      sslMode: "require"
      uriScheme: "postgresql"
      # -- extras: "options=-c search_path=your-schema -c your-other-option=xxx"
      extras: ""
    mysql:
      # -- MySQL/TiDB params, e.g. charset=utf8mb4&parseTime=true&loc=UTC
      params: "charset=utf8mb4&parseTime=true&loc=UTC"
      # -- TLS configuration
      tls: false


# Internal PostgreSQL (sub-chart)

postgresql:
  # -- Enable this component
  enabled: false
  name: postgres
  # -- Container image configuration
  image:
    # -- Container image repository
    repository: langgenius/postgresql
    registry: docker.io
  global:
    storageClass: ""
    postgresql:
      auth:
        postgresPassword: "#REPLACE_ME#"
        database: "dify"
  # @raw
  # username: ""
  # password: ""
  primary:
    initdb:
      scripts:
        # -- PostgreSQL init script to create additional databases
        my_init_script.sh: |
          #!/bin/bash
          set -e
          echo "Creating database..."
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U postgres << 'EOF'
          SELECT 'CREATE DATABASE enterprise' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'enterprise')\gexec
          SELECT 'CREATE DATABASE audit' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'audit')\gexec
          EOF

# External Redis
externalRedis:
  # -- Enable this component
  enabled: true
  useSSL: false

  host: "redis.example"
  port: 6379
  username: ""
  # -- Redis password
  password: "#REPLACE_ME#"
  # -- Database configuration
  db: 0

  sentinel:
    # -- Enable this component
    enabled: false
    nodes: ""  # Comma-separated list of Redis Sentinel nodes (host:port)
    serviceName: ""  # Name of the Redis Sentinel service to monitor
    username: ""
    # -- Redis password
    password: "#REPLACE_ME#"
    socketTimeout: 0.1  # Socket timeout in seconds for Redis Sentinel connections

  # -- Event Bus — community-only API ↔ worker pub/sub stream. Set `url`
  # to point the Event Bus at a separate Redis (typically a Redis
  # Cluster); leave `url` empty to follow the main Redis. When `url`
  # is set the chart emits EVENT_BUS_REDIS_URL / _USE_CLUSTERS into
  # the shared ConfigMap. dify-enterprise Go services do not consume
  # these envs.
  #
  # Channel type defaults to `pubsub` on the Python side. Operators
  # wanting `sharded` or `streams` can override via api / worker /
  # worker-beat / additional-worker / plugin-daemon extraEnv:
  # EVENT_BUS_REDIS_CHANNEL_TYPE=sharded
  eventBus:
    url: ""  # e.g. redis://cluster-seed:7001/0
    useClusters: false  # set true when `url` points at a Redis Cluster

redis:
  # -- Enable this component
  enabled: false
  # -- Container image configuration
  image:
    # -- Container image repository
    repository: langgenius/redis
    registry: docker.io
    # -- Image tag (overrides appVersion if non-empty)
    tag: 6.2.16-debian-12-r3
  global:
    redis:
      # -- Redis password
      password: "#REPLACE_ME#"

# vectorDB
vectorDB:
  useExternal: true
  # -- The type of vector database, support: weaviate, qdrant, milvus, relyt (pgvectors), pgvector, pgvecto-rs, tencent, opensearch, elasticsearch, analyticdb, lindorm
  # For more details, please refer to the documentation: https://github.com/langgenius/dify/blob/main/api/core/rag/datasource/vdb/vector_type.py
  externalType: "qdrant"
  externalWeaviate:
    endpoint: "http://weaviate:8080"
    # -- Weaviate API key
    apiKey: "#REPLACE_ME#"
  # -- External Qdrant
  externalQdrant:
    endpoint: "http://your-qdrant-cluster-url.qdrant.tech/"
    # -- Qdrant API key
    apiKey: "#REPLACE_ME#"
  # -- External Milvus
  externalMilvus:
    # -- URI for connecting to the Milvus server (e.g., 'http://localhost:19530' or 'https://milvus-instance.example.com:19530')
    uri: "http://127.0.0.1:19530"
    token: ""
    user: ""
    # -- Milvus password
    password: ""
    database: "default"
  externalRelyt:
    host: "your-relyt.domain"
    port: 5431
    user: "postgres"
    # -- Relyt password
    password: "#REPLACE_ME#"
    database: "pgvectors"
  externalPgVectoRS:
    host: "your-pgvectors.domain"
    port: 5432
    user: "postgres"
    # -- PgVectoRS password
    password: "#REPLACE_ME#"
    database: "pgvectors"
  externalPgvector:
    host: "your-pgvector.domain"
    port: 5432
    user: "postgres"
    # -- PGVector password
    password: "#REPLACE_ME#"
    database: "dify"
    minConnection: 1
    maxConnection: 5
    pgBigm: false
  externalTencentVectorDB:
    host: "your-tencent-vector-db.domain"
    # -- Tencent VectorDB API key
    apiKey: "#REPLACE_ME#"
    # -- Timeout in seconds
    timeout: 30
    username: "tencent"
    # -- Tencent VectorDB password
    password: "#REPLACE_ME#"
    shard: 1
    # -- Number of replicas
    replicas: 2
    database: "tencent"
  externalOpenSearch:
    host: "your-opensearch.domain"
    port: 9200
    user: ""
    # -- OpenSearch password
    password: "#REPLACE_ME#"
    useTLS: false
  externalElasticsearch:
    host: "127.0.0.1"
    port: 9200
    username: "elastic"
    # -- Elasticsearch password
    password: "#REPLACE_ME#"
  externalAnalyticDB:
    keyID: "#REPLACE_ME#"
    keySecret: "#REPLACE_ME#"
    regionID: "#REPLACE_ME#"
    instanceID: "#REPLACE_ME#"
    account: "#REPLACE_ME#"
    # -- AnalyticDB password
    password: "#REPLACE_ME#"
    host: "#REPLACE_ME#"
    port: 5432
    namespace: ""
    namespacePassword: ""
    minConnection: 1
    maxConnection: 5
  externalLindorm:
    url: "http://localhost:30070"
    username: "admin"
    # -- Lindorm password
    password: "admin"
    indexType: "hnsw"
    distanceType: "l2"
    usingUgc: true
    queryTimeout: 2.0
qdrant:
  # -- Enable this component
  enabled: false
  # -- Number of replicas
  replicaCount: 3
  # -- Container image configuration
  image:
    # -- Container image repository
    repository: langgenius/qdrant
    pullPolicy: IfNotPresent
    # -- Image tag (overrides appVersion if non-empty)
    tag: "v1.7.3"
  # -- Qdrant API key
  apiKey: "dify123456"
  persistence:
    # -- Persistence access modes
    accessModes: ["ReadWriteOnce"]
    # -- Persistence volume size
    size: 10Gi
  # -- Resource requests and limits
  # @raw
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  resources: {}
weaviate:
  # -- Enable this component
  enabled: false

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- External Prometheus
externalPrometheus:
  # -- provide a prometheus for plugin metrics monitoring
  # otherwise, the plugin manager requires a cluster role to collect metrics
  enabled: false
  endpoint: "http://prometheus:9090"
  # -- Timeout in seconds
  timeout: 10s
  username: ""
  # -- Prometheus password
  password: ""
  insecure: true

externalKubernetes:
  # -- Enable this component
  enabled: false
