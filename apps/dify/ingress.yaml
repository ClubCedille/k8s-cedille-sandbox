apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dify
  annotations:
    projectcontour.io/response-timeout: "600s"
spec:
  ingressClassName: contour
  tls:
    - hosts:
        - dify.sandbox.cedille.club
      secretName: tls-delegation/sandbox-tls
  # Same routing as the chart's built-in nginx proxy (disabled in values.yaml)
  rules:
    - host: dify.sandbox.cedille.club
      http:
        paths:
          - {path: /console/api, pathType: Prefix, backend: {service: {name: dify-api, port: {number: 5001}}}}
          - {path: /api, pathType: Prefix, backend: {service: {name: dify-api, port: {number: 5001}}}}
          - {path: /v1, pathType: Prefix, backend: {service: {name: dify-api, port: {number: 5001}}}}
          - {path: /files, pathType: Prefix, backend: {service: {name: dify-api, port: {number: 5001}}}}
          - {path: /openapi, pathType: Prefix, backend: {service: {name: dify-api, port: {number: 5001}}}}
          - {path: /mcp, pathType: Prefix, backend: {service: {name: dify-api, port: {number: 5001}}}}
          - {path: /triggers, pathType: Prefix, backend: {service: {name: dify-api, port: {number: 5001}}}}
          - {path: /e, pathType: Prefix, backend: {service: {name: dify-plugin-daemon, port: {number: 5002}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: dify-web, port: {number: 3000}}}}
