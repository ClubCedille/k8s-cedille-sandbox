apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prod/cnpg.yaml
  - prod/pvc.yaml
  - prod/ingress.yaml
  - prod/vault.yaml
helmCharts:
  - name: dify
    repo: https://langgenius.github.io/dify-helm
    version: 3.12.1
    releaseName: dify
    namespace: dify
    valuesFile: helm/values.yaml
    additionalValuesFiles:
      - overrides.yaml
patches:
  # Enterprise plugin components that values can't disable (chart uses `default true`)
  - target:
      kind: Deployment
      name: ^dify-(crd-controller|plugin-connector|plugin-manager)$
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: ignored }
  - target:
      kind: CustomResourceDefinition
      name: difyplugins.enterprise.dify.ai
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata: { name: ignored }
  # Secrets holding passwords/keys come from Vault instead (prod/vault.yaml)
  - target:
      kind: Secret
      name: ^dify-(redis|api-secret|worker-secret|worker-beat-secret|sandbox-secret|plugin-daemon-secret|plugin-connector-secret|plugin-manager-secret|shared-(db|redis|celery|vectordb)-secret)$
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata: { name: ignored }
  # kube-score pod-probes: chart hardcodes identical or missing probes for these
  # components and values.yaml exposes no override. dify-sandbox port 8194 is a
  # proprietary protocol (no HTTP alternative); the other two have no probe keys
  # in values at all. Ignoring per-resource with justification is the sanctioned
  # escape hatch (see README §"Politique kube-score").
  - target:
      kind: Deployment
      name: dify-sandbox
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dify-sandbox
        annotations:
          kube-score/ignore: pod-probes
  - target:
      kind: Deployment
      name: dify-agent-sandbox-ssrf-proxy
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dify-agent-sandbox-ssrf-proxy
        annotations:
          kube-score/ignore: pod-probes
  - target:
      kind: Deployment
      name: dify-plugin-daemon
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dify-plugin-daemon
        annotations:
          kube-score/ignore: pod-probes
