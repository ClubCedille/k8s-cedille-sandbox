apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prod/cnpg.yaml
  - prod/pvc.yaml
  - prod/ingress.yaml
  - prod/vault.yaml
helmCharts:
  - name: dify
    repo: https://langgenius.github.io/dify-helm
    version: 3.12.1
    releaseName: dify
    namespace: dify
    valuesFile: helm/values.yaml
    additionalValuesFiles:
      - overrides.yaml
patches:
  # Enterprise plugin components that values can't disable (chart uses `default true`)
  - target:
      kind: Deployment
      name: ^dify-(crd-controller|plugin-connector|plugin-manager)$
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: ignored }
  - target:
      kind: CustomResourceDefinition
      name: difyplugins.enterprise.dify.ai
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata: { name: ignored }
  # Secrets holding passwords/keys come from Vault instead (prod/vault.yaml)
  - target:
      kind: Secret
      name: ^dify-(redis|api-secret|worker-secret|worker-beat-secret|sandbox-secret|plugin-daemon-secret|plugin-connector-secret|plugin-manager-secret|shared-(db|redis|celery|vectordb)-secret)$
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata: { name: ignored }
  # kube-score pod-probes / pod-probes-identical: the upstream chart's
  # probes have identical handlers (dify-api /health both, dify-web tcp:3000
  # both, dify-sandbox tcp:8194 both, dify-agent-sandbox-ssrf-proxy same)
  # or are missing entirely (dify-plugin-daemon). values.yaml can't fix
  # this: helm deep-merges probe maps so a partial override renders an
  # invalid dual-handler Probe. Ignoring per-resource is the sanctioned
  # escape (see README §"Politique kube-score").
  - target:
      kind: Deployment
      name: dify-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dify-api
        annotations:
          kube-score/ignore: pod-probes, pod-probes-identical
  - target:
      kind: Deployment
      name: dify-web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dify-web
        annotations:
          kube-score/ignore: pod-probes, pod-probes-identical
  - target:
      kind: Deployment
      name: dify-sandbox
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dify-sandbox
        annotations:
          kube-score/ignore: pod-probes, pod-probes-identical
  - target:
      kind: Deployment
      name: dify-agent-sandbox-ssrf-proxy
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dify-agent-sandbox-ssrf-proxy
        annotations:
          kube-score/ignore: pod-probes, pod-probes-identical
  - target:
      kind: Deployment
      name: dify-plugin-daemon
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dify-plugin-daemon
        annotations:
          kube-score/ignore: pod-probes, pod-probes-identical
