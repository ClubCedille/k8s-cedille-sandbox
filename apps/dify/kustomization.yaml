apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prod/cnpg.yaml
  - prod/pvc.yaml
  - prod/ingress.yaml
  - prod/vault.yaml
helmCharts:
  - name: dify
    repo: https://langgenius.github.io/dify-helm
    version: 3.12.1
    releaseName: dify
    namespace: dify
    valuesFile: helm/values.yaml
    additionalValuesFiles:
      - overrides.yaml
patches:
  # Enterprise plugin components that values can't disable (chart uses `default true`)
  - target:
      kind: Deployment
      name: ^dify-(crd-controller|plugin-connector|plugin-manager)$
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: ignored }
  # ...and their Services, which would otherwise select no pods
  - target:
      kind: Service
      name: ^dify-(plugin-connector|plugin-manager)-svc$
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: ignored }
  - target:
      kind: CustomResourceDefinition
      name: difyplugins.enterprise.dify.ai
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata: { name: ignored }
  # The chart has no probe settings for the plugin daemon
  - target:
      kind: Deployment
      name: dify-plugin-daemon
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dify-plugin-daemon
      spec:
        template:
          spec:
            containers:
              - name: dify-plugin-daemon
                readinessProbe:
                  httpGet:
                    path: /health/check
                    port: 5002
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                livenessProbe:
                  tcpSocket:
                    port: 5002
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 3
  # The chart hardcodes imagePullPolicy: IfNotPresent (every Deployment has one container)
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  # Run the dify app images as an unprivileged UID/GID (>= 10000 for kube-score).
  # fsGroup makes the shared app-data PVC writable for that user.
  - target:
      kind: Deployment
      name: ^dify-(api|worker|worker-beat|trigger-worker|web|plugin-daemon)$
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          fsGroup: 10001
          fsGroupChangePolicy: OnRootMismatch
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
  # Squid starts as root and drops to the proxy user itself
  - target:
      kind: Deployment
      name: ^dify-(ssrf-proxy|agent-sandbox-ssrf-proxy)$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
  # kube-score checks skipped on purpose (same as apps/httpbin):
  # - pod-networkpolicy: no NetworkPolicies in this cluster yet
  # - container-security-context-readonlyrootfilesystem: the images write to their filesystem
  # - container-security-context-user-group-id: sandbox needs root for chroot, squid
  #   starts as root
  # - pod-probes-identical: agent-sandbox squid probes are hardcoded in the chart
  #   (TCP 3128 for both) and squid has no HTTP health endpoint
  - target:
      kind: Deployment
      name: ^dify-(api|worker|worker-beat|trigger-worker|web|plugin-daemon)$
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
        annotations:
          kube-score/ignore: pod-networkpolicy, container-security-context-readonlyrootfilesystem
  - target:
      kind: Deployment
      name: ^dify-(sandbox|ssrf-proxy)$
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
        annotations:
          kube-score/ignore: pod-networkpolicy, container-security-context-readonlyrootfilesystem, container-security-context-user-group-id
  - target:
      kind: Deployment
      name: dify-agent-sandbox-ssrf-proxy
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
        annotations:
          kube-score/ignore: pod-networkpolicy, container-security-context-readonlyrootfilesystem, container-security-context-user-group-id, pod-probes-identical
  - target:
      kind: StatefulSet
      name: dify-redis-master
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: ignored
        annotations:
          kube-score/ignore: pod-networkpolicy, container-security-context-readonlyrootfilesystem
  # Secrets holding passwords/keys come from Vault instead (prod/vault.yaml)
  - target:
      kind: Secret
      name: ^dify-(redis|api-secret|worker-secret|worker-beat-secret|sandbox-secret|plugin-daemon-secret|plugin-connector-secret|plugin-manager-secret|shared-(db|redis|celery|vectordb)-secret)$
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata: { name: ignored }
