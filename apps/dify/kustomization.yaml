apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The chart only sets a namespace on some objects; make it consistent so
# NetworkPolicies match every pod (Argo deploys everything to dify anyway)
namespace: dify
resources:
  - prod/cnpg.yaml
  - prod/pvc.yaml
  - prod/ingress.yaml
  - prod/vault.yaml
  - prod/networkpolicy.yaml
helmCharts:
  - name: dify
    repo: https://langgenius.github.io/dify-helm
    version: 3.12.1
    releaseName: dify
    namespace: dify
    valuesFile: helm/values.yaml
    additionalValuesFiles:
      - overrides.yaml
# What the chart can't set through values (see the comments in patches.yaml)
patches:
  - path: patches.yaml
