apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prod/cnpg.yaml
  - prod/pvc.yaml
  - prod/ingress.yaml
  - prod/vault.yaml
helmCharts:
  - name: dify
    repo: https://langgenius.github.io/dify-helm
    version: 3.12.1
    releaseName: dify
    namespace: dify
    valuesFile: helm/values.yaml
    additionalValuesFiles:
      - overrides.yaml
patches:
  # Enterprise plugin components that values can't disable (chart uses `default true`)
  - target:
      kind: Deployment
      name: ^dify-(crd-controller|plugin-connector|plugin-manager)$
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: ignored }
  - target:
      kind: CustomResourceDefinition
      name: difyplugins.enterprise.dify.ai
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata: { name: ignored }
  # Probes are hardcoded in the chart (TCP 3128 for both) and squid has no HTTP
  # health endpoint, so skip kube-score's identical-probe check here
  - target:
      kind: Deployment
      name: dify-agent-sandbox-ssrf-proxy
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dify-agent-sandbox-ssrf-proxy
        annotations:
          kube-score/ignore: pod-probes-identical
  # The chart has no probe settings for the plugin daemon
  - target:
      kind: Deployment
      name: dify-plugin-daemon
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dify-plugin-daemon
      spec:
        template:
          spec:
            containers:
              - name: dify-plugin-daemon
                readinessProbe:
                  httpGet:
                    path: /health/check
                    port: 5002
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                livenessProbe:
                  tcpSocket:
                    port: 5002
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 3
  # Secrets holding passwords/keys come from Vault instead (prod/vault.yaml)
  - target:
      kind: Secret
      name: ^dify-(redis|api-secret|worker-secret|worker-beat-secret|sandbox-secret|plugin-daemon-secret|plugin-connector-secret|plugin-manager-secret|shared-(db|redis|celery|vectordb)-secret)$
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata: { name: ignored }
